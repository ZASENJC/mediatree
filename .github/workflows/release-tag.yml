name: Auto Update Release Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Get version from VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION | head -1 | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Force update tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f ${{ steps.version.outputs.version }} ${{ github.sha }}
          git push origin ${{ steps.version.outputs.version }} --force

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Find the section for this version in CHANGELOG_zh-CN.md
          CONTENT=$(awk -v ver="$VERSION" '
            BEGIN { found=0; buf="" }
            /^## / {
              if (found) exit
              if ($0 ~ ver) { found=1; next }
            }
            found { buf = buf $0 "\n" }
            END { print buf }
          ' CHANGELOG_zh-CN.md | head -n -1)
          # Write to file to avoid special char issues
          echo "$CONTENT" > /tmp/release_body.md
          echo "exists=true" >> $GITHUB_OUTPUT

      - name: Build frontend
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run build

      - name: Build app update package
        id: app_package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG_DIR="/tmp/mediatree-app-$VERSION"
          ARCHIVE="/tmp/mediatree-app-$VERSION.tar.gz"
          MANIFEST="/tmp/mediatree-app-$VERSION.manifest.json"
          SHA_FILE="/tmp/mediatree-app-$VERSION.sha256"

          rm -rf "$PKG_DIR" "$ARCHIVE" "$MANIFEST" "$SHA_FILE"
          mkdir -p "$PKG_DIR/frontend"
          cp -R backend/app "$PKG_DIR/app"
          cp backend/requirements.txt "$PKG_DIR/requirements.txt"
          cp -R frontend/dist "$PKG_DIR/frontend/dist"
          cp VERSION "$PKG_DIR/VERSION"

          cat > "$PKG_DIR/manifest.json" <<EOF
          {
            "version": "$VERSION",
            "base_api": 1,
            "requires_image_update": false,
            "archive": "mediatree-app-$VERSION.tar.gz",
            "sha256": "",
            "size": 0,
            "notes": ""
          }
          EOF

          tar -czf "$ARCHIVE" -C /tmp --transform "s#^mediatree-app-$VERSION/##" "mediatree-app-$VERSION"
          SHA="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          SIZE="$(stat -c%s "$ARCHIVE")"
          printf '%s  mediatree-app-%s.tar.gz\n' "$SHA" "$VERSION" > "$SHA_FILE"
          cat > "$MANIFEST" <<EOF
          {
            "version": "$VERSION",
            "base_api": 1,
            "requires_image_update": false,
            "archive": "mediatree-app-$VERSION.tar.gz",
            "sha256": "$SHA",
            "size": $SIZE,
            "notes": ""
          }
          EOF

          echo "archive=$ARCHIVE" >> $GITHUB_OUTPUT
          echo "manifest=$MANIFEST" >> $GITHUB_OUTPUT
          echo "sha_file=$SHA_FILE" >> $GITHUB_OUTPUT

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          body_path: /tmp/release_body.md
          make_latest: true
          files: |
            ${{ steps.app_package.outputs.archive }}
            ${{ steps.app_package.outputs.manifest }}
            ${{ steps.app_package.outputs.sha_file }}
