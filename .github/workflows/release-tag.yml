name: Auto Update Release Tag

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_REQUIRES_IMAGE_UPDATE: "false"
      RELEASE_REQUIRES_WINDOWS_BASE_UPDATE: "false"
      RELEASE_UPDATE_REASON: "应用包级更新；不需要完整 Docker 镜像更新。"
      RELEASE_WINDOWS_UPDATE_REASON: "应用包级更新；不需要更新 Windows 桌面版基础运行时。"
      RELEASE_METADATA_FILE: ".github/release-metadata.json"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt

      - name: Get version from VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION | head -1 | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Resolve release metadata
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          metadata_path = Path(os.environ.get("RELEASE_METADATA_FILE", ".github/release-metadata.json"))
          fallback = {
              "requires_image_update": False,
              "requires_windows_base_update": False,
              "reason": "应用包级更新；不需要完整 Docker 镜像更新。",
              "windows_reason": "应用包级更新；不需要更新 Windows 桌面版基础运行时。",
          }
          metadata = {}
          if metadata_path.exists():
              metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          release = metadata.get("versions", {}).get(version, metadata.get("default", fallback))
          requires_image_update = "true" if release.get("requires_image_update") else "false"
          requires_windows_base_update = "true" if release.get("requires_windows_base_update") else "false"
          reason = release.get("reason") or fallback["reason"]
          windows_reason = release.get("windows_reason") or fallback["windows_reason"]

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"RELEASE_REQUIRES_IMAGE_UPDATE={requires_image_update}\n")
              env.write(f"RELEASE_REQUIRES_WINDOWS_BASE_UPDATE={requires_windows_base_update}\n")
              env.write("RELEASE_UPDATE_REASON<<EOF\n")
              env.write(reason + "\n")
              env.write("EOF\n")
              env.write("RELEASE_WINDOWS_UPDATE_REASON<<EOF\n")
              env.write(windows_reason + "\n")
              env.write("EOF\n")
          PY
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Find the section for this version in CHANGELOG_zh-CN.md
          CONTENT=$(awk -v ver="$VERSION" '
            BEGIN { found=0; buf="" }
            /^## / {
              if (found) exit
              if ($0 ~ ver) { found=1; next }
            }
            found { buf = buf $0 "\n" }
            END { print buf }
          ' CHANGELOG_zh-CN.md | head -n -1)
          # Write to file to avoid special char issues
          echo "$CONTENT" > /tmp/release_body.md
          echo "exists=true" >> $GITHUB_OUTPUT

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt -c backend/constraints.txt

      - name: Run backend tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_*.py'
        working-directory: backend

      - name: Compile backend
        run: python -m compileall -q backend/app

      - name: Build frontend
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run build

      - name: Build app update package
        id: app_package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG_DIR="/tmp/mediatree-app-$VERSION"
          ARCHIVE="/tmp/mediatree-app-$VERSION.tar.gz"
          MANIFEST="/tmp/mediatree-app-$VERSION.manifest.json"
          SHA_FILE="/tmp/mediatree-app-$VERSION.sha256"

          rm -rf "$PKG_DIR" "$ARCHIVE" "$MANIFEST" "$SHA_FILE"
          mkdir -p "$PKG_DIR/frontend"
          cp -R backend/app "$PKG_DIR/app"
          cp backend/requirements.txt "$PKG_DIR/requirements.txt"
          cp backend/constraints.txt "$PKG_DIR/constraints.txt"
          cp -R frontend/dist "$PKG_DIR/frontend/dist"
          cp VERSION "$PKG_DIR/VERSION"

          cat > "$PKG_DIR/manifest.json" <<EOF
          {
            "version": "$VERSION",
            "base_api": 1,
            "requires_image_update": $RELEASE_REQUIRES_IMAGE_UPDATE,
            "requires_windows_base_update": $RELEASE_REQUIRES_WINDOWS_BASE_UPDATE,
            "reason": "$RELEASE_UPDATE_REASON",
            "windows_reason": "$RELEASE_WINDOWS_UPDATE_REASON",
            "archive": "mediatree-app-$VERSION.tar.gz",
            "sha256": "",
            "size": 0,
            "notes": ""
          }
          EOF

          tar -czf "$ARCHIVE" -C /tmp --transform "s#^mediatree-app-$VERSION/##" "mediatree-app-$VERSION"
          SHA="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          SIZE="$(stat -c%s "$ARCHIVE")"
          printf '%s  mediatree-app-%s.tar.gz\n' "$SHA" "$VERSION" > "$SHA_FILE"
          cat > "$MANIFEST" <<EOF
          {
            "version": "$VERSION",
            "base_api": 1,
            "requires_image_update": $RELEASE_REQUIRES_IMAGE_UPDATE,
            "requires_windows_base_update": $RELEASE_REQUIRES_WINDOWS_BASE_UPDATE,
            "reason": "$RELEASE_UPDATE_REASON",
            "windows_reason": "$RELEASE_WINDOWS_UPDATE_REASON",
            "archive": "mediatree-app-$VERSION.tar.gz",
            "sha256": "$SHA",
            "size": $SIZE,
            "notes": ""
          }
          EOF

          echo "archive=$ARCHIVE" >> $GITHUB_OUTPUT
          echo "manifest=$MANIFEST" >> $GITHUB_OUTPUT
          echo "sha_file=$SHA_FILE" >> $GITHUB_OUTPUT

      - name: Update tag after validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f ${{ steps.version.outputs.version }} ${{ github.sha }}
          git push origin ${{ steps.version.outputs.version }} --force

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          body_path: /tmp/release_body.md
          make_latest: true
          files: |
            ${{ steps.app_package.outputs.archive }}
            ${{ steps.app_package.outputs.manifest }}
            ${{ steps.app_package.outputs.sha_file }}

      - name: Notify Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_REQUIRES_IMAGE_UPDATE: ${{ env.RELEASE_REQUIRES_IMAGE_UPDATE }}
          RELEASE_UPDATE_REASON: ${{ env.RELEASE_UPDATE_REASON }}
        run: bash .github/scripts/notify-telegram-release.sh
