# Project-local Codex baseline for MediaTree.
# User credentials and personal MCP env values belong in ~/.codex/config.toml.

sandbox_mode = "workspace-write"

[features]
multi_agent = true
image_generation = false

[agents.explorer]
config = ".codex/agents/explorer.toml"

[agents.reviewer]
config = ".codex/agents/reviewer.toml"

[agents.docs-researcher]
config = ".codex/agents/docs-researcher.toml"

[mcp_servers.github]
type = "stdio"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]

[mcp_servers.context7]
type = "stdio"
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.exa]
type = "stdio"
command = "npx"
args = ["-y", "exa-mcp-server"]

[mcp_servers.memory]
type = "stdio"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-memory"]

[mcp_servers.playwright]
type = "stdio"
command = "npx"
args = ["-y", "@playwright/mcp@latest"]

[mcp_servers.sequential-thinking]
type = "stdio"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]

[mcp_servers.supabase]
type = "stdio"
command = "npx"
args = ["-y", "@supabase/mcp-server-supabase"]

[mcp_servers.supabase.env]
SUPABASE_ACCESS_TOKEN = ""
