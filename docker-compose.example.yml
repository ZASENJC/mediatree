services:
  mediatree:
    image: zasenjc/mediatree:latest
    container_name: mediatree
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    user: "${PUID:-1000}:${PGID:-1000}"
    security_opt:
      - no-new-privileges:true

    ports:
      # 左侧是宿主机访问端口，启动后打开 http://localhost:27580
      - "27580:80"

    volumes:
      # 数据目录（持久化数据库、封面缓存、配置）
      - ./data:/app/data

      # 媒体目录（只读）。左侧改成宿主机真实路径，右侧是容器内路径。
      - /path/to/your/media:/media/movies:ro

      # 需要多个媒体库时继续添加：
      # - /path/to/your/anime:/media/anime:ro

      # 可选：允许设置页执行完整 Docker 镜像更新。
      # 原因：容器需要通过宿主机 Docker 拉取新镜像并重建自身。
      # 风险：这等同于把宿主机 Docker 控制权交给容器；普通应用包更新不需要，也不建议默认启用。
      # 注意：如果要从设置页执行完整镜像更新，镜像还必须包含 Docker CLI。
      # - /var/run/docker.sock:/var/run/docker.sock

    env_file:
      - .env

    environment:
      PORT: "80"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
