services:
  mediatree:
    image: zasenjc/mediatree:latest
    build:
      context: .
      # 可选：如果你自己构建镜像，并希望设置页能执行完整 Docker 镜像更新，
      # 需要把 Docker CLI 打进镜像；直接使用 Docker Hub latest 时不用改这里。
      args:
        INCLUDE_DOCKER_CLI: "false"
    container_name: mediatree
    ports:
      - "${HOST_PORT:-27580}:80"
    volumes:
      # 挂载你的媒体目录（只读），格式：/你的/本地/路径:/media/别名:ro
      - /path/to/your/media:/media/movies:ro
      # 数据目录（持久化数据库、封面缓存、配置）
      - ${DATA_DIR:-./data}:/app/data
      # 可选：允许设置页执行完整 Docker 镜像更新。
      # 原因：容器需要通过宿主机 Docker 拉取新镜像并重建自身。
      # 风险：这等同于把宿主机 Docker 控制权交给容器；普通应用包更新不需要。
      # - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    environment:
      - PORT=80
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
